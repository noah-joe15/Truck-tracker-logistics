<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MALIBORA - International Logistics Truck Management System</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13" rx="2"></rect>
          <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
          <circle cx="5.5" cy="18.5" r="2.5"></circle>
          <circle cx="18.5" cy="18.5" r="2.5"></circle>
        </svg>
      </div>
      <h1>MALIBORA</h1>
      <p class="subtitle">International Logistics Truck Management System (ILTM)</p>
      <input type="text" id="loginUser" placeholder="Username" />
      <input type="password" id="loginPass" placeholder="Password" />
      <button id="loginBtn">LOGIN</button>
      <p class="support">
        <strong>Need Help? Contact Support:</strong><br>
        +255 753 453 518 | malibora.tanzania@gmail.com<br>
        Dar es Salaam, Tanzania
      </p>
    </div>
    <div class="login-footer">System v9.1 | History Grid Edition</div>
  </section>

  <!-- MAIN APP -->
  <div id="appShell" class="app-shell hidden">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13" rx="2"></rect>
          <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
          <circle cx="5.5" cy="18.5" r="2.5"></circle>
          <circle cx="18.5" cy="18.5" r="2.5"></circle>
        </svg>
        MALIBORA <span>ILTM v9.2</span>
      </div>
      <nav class="main-nav">
        <button data-view="dashboard" class="nav-btn active">Dashboard</button>
        <button data-view="kpi" class="nav-btn">KPI Dashboard</button>
        <button data-view="map" class="nav-btn">Live Map</button>
        <button data-view="history" class="nav-btn">History</button>
        <button data-view="analytics" class="nav-btn">Analytics</button>
        <button data-view="debt" class="nav-btn">Collect Debt</button>
        <button data-view="operations" class="nav-btn">Operations</button>
        <button data-view="compliance" class="nav-btn">Compliance</button>
        <button data-view="settings" class="nav-btn">Settings</button>
      </nav>
      <button id="logoutBtn" class="logout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Logout
      </button>
    </header>

    <main id="viewContainer" class="view-container"></main>
  </div>

  <!-- ALL JS FILES ARE IN ROOT, NOT IN js/ FOLDER -->
  <script src="storage.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
  <script src="kpi.js"></script>
  <script src="operations.js"></script>
  <script src="trucks.js"></script>
  <script src="drivers.js"></script>
  <script src="customers.js"></script>
  <script src="compliance.js"></script>
  <script src="debt.js"></script>
  <script src="analytics.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
