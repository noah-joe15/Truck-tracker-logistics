<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MALIBORA - International Logistics Truck Management System</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <section id="loginScreen" class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%230B6E4F'%3E%3Cpath d='M1 3h15v13H1z' opacity='.3'/%3E%3Cpath d='M16 8h4l3 3v5h-7z'/%3E%3Ccircle cx='5.5' cy='18.5' r='2.5'/%3E%3Ccircle cx='18.5' cy='18.5' r='2.5'/%3E%3C/svg%3E" alt="Malibora Logo" class="login-logo" />
        <h1>MALIBORA</h1>
        <p class="subtitle">International Logistics Truck Management System (ILTM)</p>
      </div>
      <div class="form-group">
        <input type="text" id="loginUser" placeholder="Username" />
      </div>
      <div class="form-group">
        <input type="password" id="loginPass" placeholder="Password" />
      </div>
      <button id="loginBtn">LOGIN</button>
      <p class="support">
        <strong>Need Help? Contact Support:</strong><br>
        +255 753 453 518 | malibora.tanzania@gmail.com<br>
        Dar es Salaam, Tanzania
      </p>
    </div>
    <div class="login-footer">System v9.1 | History Grid Edition</div>
  </section>

  <!-- MAIN APP -->
  <div id="appShell" class="hidden">
    <header class="topbar">
      <button class="burger" id="burgerBtn">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <div class="brand">
        <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M1 3h15v13H1z' opacity='.3'/%3E%3Cpath d='M16 8h4l3 3v5h-7z'/%3E%3Ccircle cx='5.5' cy='18.5' r='2.5'/%3E%3Ccircle cx='18.5' cy='18.5' r='2.5'/%3E%3C/svg%3E" alt="Logo" class="brand-icon" />
        <div class="brand-text">
          <strong>MALIBORA</strong>
          <span>ILTM v9.2</span>
        </div>
      </div>
      
      <div class="topbar-actions">
        <div class="connection-status online">
          <i class="fas fa-wifi"></i>
          <span>Online</span>
        </div>
        <button id="logoutBtn" class="btn-logout">
          <i class="fas fa-sign-out-alt"></i>
          Logout
        </button>
      </div>
    </header>

    <div class="app-layout">
      <div class="scrim" id="scrim"></div>
      
      <nav class="sidebar" id="sidebar">
        <button data-view="dashboard" class="nav-btn active">
          <i class="fas fa-tachometer-alt"></i>
          Dashboard
        </button>
        <button data-view="kpi" class="nav-btn">
          <i class="fas fa-chart-line"></i>
          KPI Dashboard
        </button>
        <button data-view="map" class="nav-btn">
          <i class="fas fa-map-marked-alt"></i>
          Live Map
        </button>
        <button data-view="history" class="nav-btn">
          <i class="fas fa-history"></i>
          History
        </button>
        <button data-view="analytics" class="nav-btn">
          <i class="fas fa-chart-bar"></i>
          Analytics
        </button>
        <button data-view="debt" class="nav-btn">
          <i class="fas fa-hand-holding-usd"></i>
          Collect Debt
        </button>
        <button data-view="operations" class="nav-btn">
          <i class="fas fa-truck"></i>
          Operations
        </button>
        <button data-view="compliance" class="nav-btn">
          <i class="fas fa-shield-alt"></i>
          Compliance
        </button>
        <button data-view="settings" class="nav-btn">
          <i class="fas fa-cog"></i>
          Settings
        </button>
      </nav>

      <main id="viewContainer" class="main-content"></main>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  <script src="dashboard.js"></script>
  <script src="kpi.js"></script>
  <script src="operations.js"></script>
  <script src="trucks.js"></script>
  <script src="drivers.js"></script>
  <script src="customers.js"></script>
  <script src="compliance.js"></script>
  <script src="debt.js"></script>
  <script src="analytics.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
