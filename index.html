<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MALIBORA - International Logistics Truck Management System</title>
  
  <!-- Favicon - NEW TRUCK ICON -->
  <link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
  <link rel="icon" type="image/png" href="favicon.png" sizes="16x16">
  
  <!-- Apple Touch Icon (for iOS) -->
  <link rel="apple-touch-icon" href="app-icon.png">
  
  <!-- Core Styles -->
  <link rel="stylesheet" href="styles.css" />
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <!-- jsPDF + autoTable for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  
  <!-- SheetJS for Excel Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

  <!-- ===================================================== -->
  <!-- SVG ICON SPRITE (Premium, No Emojis)                -->
  <!-- ===================================================== -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></symbol>
    <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></symbol>
  </svg>

  <!-- LOGIN SCREEN -->
  <section id="loginScreen" class="login-overlay">
    <div class="login-card">
      <div class="login-header">
        <!-- NEW TRUCK LOGO -->
        <img src="logo.png" alt="Malibora Logo" class="login-logo" />
        <h1>MALIBORA</h1>
        <p class="subtitle">International Logistics Truck Management System (ILTM)</p>
      </div>
      <div class="form-group">
        <input type="text" id="loginUser" class="input-field" placeholder="Username" />
      </div>
      <div class="form-group">
        <input type="password" id="loginPass" class="input-field" placeholder="Password" />
      </div>
      <button id="loginBtn" class="btn-primary">LOGIN</button>
      <p class="support">
        <strong>Need Help? Contact Support:</strong><br>
        +255 753 453 518 | malibora.tanzania@gmail.com<br>
        Dar es Salaam, Tanzania
      </p>
    </div>
    <div class="login-footer">System v9.2 | Complete Edition</div>
  </section>

  <!-- MAIN APP -->
  <div id="appShell" class="hidden">
    <header class="topbar">
      <button class="burger" id="burgerBtn">
        <span></span>
        <span></span>
        <span></span>
      </button>
      
      <div class="brand">
        <!-- NEW TRUCK ICON FOR HEADER -->
        <img src="app-icon.png" alt="Logo" class="brand-icon" />
        <div class="brand-text">
          <strong>MALIBORA</strong>
          <span>ILTM v9.2</span>
        </div>
      </div>
      
      <div class="topbar-actions">
        <div class="connection-status online">
          <i class="fas fa-wifi"></i>
          <span>Online</span>
        </div>
        <button id="logoutBtn" class="btn-logout">
          <i class="fas fa-sign-out-alt"></i>
          <span>Logout</span>
        </button>
      </div>
    </header>

    <div class="app-layout">
      <div class="scrim" id="scrim"></div>
      
      <nav class="sidebar" id="sidebar">
        <button data-view="dashboard" class="nav-btn active">
          <i class="fas fa-tachometer-alt"></i> Dashboard
        </button>
        <button data-view="kpi" class="nav-btn">
          <i class="fas fa-chart-line"></i> KPI Dashboard
        </button>
        <button data-view="expenses" class="nav-btn">
          <i class="fas fa-wallet"></i> Expenses
        </button>
        <button data-view="map" class="nav-btn">
          <i class="fas fa-map-marked-alt"></i> Live Map
        </button>
        <button data-view="history" class="nav-btn">
          <i class="fas fa-clock-rotate-left"></i> History
        </button>
        <button data-view="analytics" class="nav-btn">
          <i class="fas fa-chart-bar"></i> Analytics
        </button>
        <button data-view="debt" class="nav-btn">
          <i class="fas fa-hand-holding-usd"></i> Collect Debt
        </button>
        <button data-view="operations" class="nav-btn">
          <i class="fas fa-truck"></i> Operations
        </button>
        <button data-view="compliance" class="nav-btn">
          <i class="fas fa-shield-alt"></i> Compliance
        </button>
        <button data-view="settings" class="nav-btn">
          <i class="fas fa-cog"></i> Settings
        </button>
      </nav>

      <main id="viewContainer" class="main-content"></main>
    </div>
  </div>

  <!-- ===================================================== -->
  <!-- SCRIPTS: ORDER MATTERS! (app.js MUST be last)       -->
  <!-- ===================================================== -->
  <script src="storage.js"></script>
  <script src="utils.js"></script>
  <script src="auth.js"></script>
  
  <!-- Core Modules -->
  <script src="dashboard.js"></script>
  <script src="kpi.js"></script>
  <script src="trucks.js"></script>
  <script src="drivers.js"></script>
  <script src="customers.js"></script>
  <script src="compliance.js"></script>
  <script src="debt.js"></script>
  <script src="expenses.js"></script>
  <script src="analytics.js"></script>
  
  <!-- Map & Advanced Operations -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="map.js"></script>
  <script src="tripOperations.js"></script>
  
  <!-- History Module -->
  <script src="history.js"></script>
  
  <!-- App Initialization (LAST) -->
  <script src="app.js"></script> 
</body>
</html>
